# msss-urgences-cli install manifest — consumed by install-repo.sh.
name: msss-urgences-cli

# No cron jobs for install-repo.sh to install, no databases, no promoted
# plugins. The CLI itself is query-on-demand.
#
# One scheduled job does run, but only on one designated computer, set up by
# hand: scripts/archive-sources.sh, from cron every 15 minutes, commits new
# MSSS CSV versions to archive/ on main (it can't run on GitHub Actions; MSSS
# refuses GitHub's runners). On GitHub, .github/workflows/pages.yml deploys
# the history API on each data push, and archive-freshness.yml alerts when
# the archive goes stale. See docs/archive-job.md. Installing this repo
# doesn't schedule anything.
#
# (The runtime dependency — Node — is already present; npm-managed deps are
# installed by install.sh.) Declared, if any, under dependencies.tool below.
#
# dependencies:
#   tool:
#     - command: msss-urgences
#       uv: ...
