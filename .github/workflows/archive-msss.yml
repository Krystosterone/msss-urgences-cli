# Snapshots the MSSS open-data CSVs into archive/ and pushes them to main, then
# rebuilds the static history API (GitHub Pages) when the archive changed.
# Setup and troubleshooting: docs/archive-job.md
name: archive-msss

on:
  schedule:
    # Every 15 minutes, off the top of the hour (GitHub delays or drops
    # scheduled runs under load, worst at :00). MSSS publishes urgences once an
    # hour (~:45), so four tries an hour make missing an hour unlikely; runs
    # with no new data commit nothing.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  # Redeploy the API when the code that builds it changes.
  push:
    branches: [main]
    paths:
      - 'src/core/history.ts'
      - 'src/core/historyBuild.ts'
      - 'src/core/parse.ts'
      - 'scripts/build-api.ts'
      - '.github/workflows/archive-msss.yml'

concurrency:
  group: archive-msss
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.archive.outputs.pushed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # Full commit history (for the rebase) without every past version of
          # the archived files; git fetches blobs on demand.
          fetch-depth: 0
          filter: blob:none
          # If main's branch protection blocks the default token, see
          # docs/archive-job.md ("Branch protection"): add a deploy key here.
          # ssh-key: ${{ secrets.ARCHIVE_DEPLOY_KEY }}
      - name: Mark this checkout as owned by the job
        run: git config msss-archive.dedicated true
      - name: Archive MSSS CSVs
        id: archive
        env:
          ARCHIVE_GIT_NAME: github-actions[bot]
          ARCHIVE_GIT_EMAIL: 41898299+github-actions[bot]@users.noreply.github.com
        run: bash scripts/archive-sources.sh

  pages:
    needs: archive
    # Deploy when the archive moved (even if one source failed this run), and on
    # manual runs and code pushes. Unchanged scheduled runs skip this job.
    if: ${{ !cancelled() && (needs.archive.outputs.pushed == 'true' || github.event_name != 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # the commit the archive job just pushed
          fetch-depth: 0 # the builder reads every archived version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the history API
        run: npx tsx scripts/build-api.ts site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
