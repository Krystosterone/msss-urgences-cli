# Checks every pull request and every code push to main.
# archive/ is data written by the archive-msss job: changes there alone skip CI.
name: ci

on:
  pull_request:
    paths-ignore: ['archive/**']
  push:
    branches: [main]
    paths-ignore: ['archive/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json declares node >= 18; cover every major from there.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Test (offline; includes the archive job against a throwaway repo)
        run: npm test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Agent Skills spec conformance
        run: python3 scripts/validate-skills.py
      - name: Shellcheck
        run: shellcheck scripts/archive-sources.sh install.sh
      - name: Lint workflows
        run: |
          pip install --quiet actionlint-py==1.7.12.25
          actionlint
